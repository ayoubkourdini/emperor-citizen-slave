<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 md:pb-0">
  <header
    class="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between md:px-8 md:justify-start md:gap-20 md:px-8 md:py-0 md:h-16">
    <h1 class="text-lg font-bold text-amber-400 md:text-xl">Club de cartes</h1>

    <nav
      class="fixed  bottom-0 inset-x-0 z-10 flex bg-slate-800 border-t border-slate-700 md:static md:border-t-0 md:flex-1 gap-8">
      <a href="./index.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Profils</a>
      <a href="./jeu.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Jeu</a>
      <a href="./historique.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Historique</a>
    </nav>

    <p id="current-player" class="text-xs bg-slate-700 px-3 py-1 rounded-full md:text-sm md:px-4 md:py-2">Aucun joueur
      choisi</p>
  </header>

  <main class="p-4 max-w-6xl mx-auto md:p-8">
    <section id="page-profiles">
      <div class="space-y-4 md:flex md:gap-8 md:space-y-0">
        <form action="" id="profile-form" class=" bg-slate-800 p-4 rounded-xl space-y-3 md:self-start md:p-6 md:w-96">
          <h2 class="text-lg font-bold md:text-xl">Nouveau profil</h2>

          <input id="profile-id" type="hidden">
          <label class="block text-sm text-slate-300" for="">Pseudo</label>

          <input
            class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400"
            id="nickname" type="text">
          <label class="block text-sm text-slate-300" for="">Avatar</label>
          <p class="text-red-400 text-sm" id="profile-error"></p>


          <div id="avatar-list" class="flex gap-3 flex-wrap">
            <svg class="avatar w-14 h-14 rounded-full cursor-pointer border-4 border-transparent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="32" fill="#0ea5e9" />
              <circle cx="32" cy="30" r="14" fill="#fcd9b6" />
              <path d="M18 28 Q32 8 46 28 Q32 20 18 28 Z" fill="#4b2e1e" />
              <circle cx="27" cy="31" r="2" fill="#333" />
              <circle cx="37" cy="31" r="2" fill="#333" />
              <path d="M27 38 Q32 42 37 38" stroke="#333" stroke-width="2" fill="none" />
              <path d="M10 64 Q32 44 54 64 Z" fill="#1e3a8a" />
            </svg>
            <svg class="avatar w-14 h-14 rounded-full cursor-pointer border-4 border-transparent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="32" fill="#64748b" />
              <circle cx="32" cy="30" r="14" fill="#e0b894" />
              <circle cx="27" cy="31" r="2" fill="#333" />
              <circle cx="37" cy="31" r="2" fill="#333" />
              <path d="M27 40 Q32 37 37 40" stroke="#333" stroke-width="2" fill="none" />
              <path d="M10 64 Q32 46 54 64 Z" fill="#78716c" />
              <circle cx="14" cy="52" r="4" fill="none" stroke="#d1d5db" stroke-width="2" />
              <circle cx="20" cy="56" r="4" fill="none" stroke="#d1d5db" stroke-width="2" />
            </svg>
            <svg class="avatar w-14 h-14 rounded-full cursor-pointer border-4 border-transparent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="32" fill="#10b981" />
              <circle cx="32" cy="32" r="14" fill="#fcd9b6" />
              <circle cx="26" cy="31" r="5" fill="none" stroke="#333" stroke-width="2" />
              <circle cx="38" cy="31" r="5" fill="none" stroke="#333" stroke-width="2" />
              <line x1="31" y1="31" x2="33" y2="31" stroke="#333" stroke-width="2" />
              <path d="M27 40 Q32 44 37 40" stroke="#333" stroke-width="2" fill="none" />
            </svg>
            <svg class="avatar w-14 h-14 rounded-full cursor-pointer border-4 border-transparent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="32" fill="#f97316" />
              <circle cx="32" cy="34" r="14" fill="#fcd9b6" />
              <rect x="16" y="18" width="32" height="8" rx="3" fill="#1f2937" />
              <rect x="22" y="8" width="20" height="14" rx="3" fill="#1f2937" />
              <circle cx="27" cy="35" r="2" fill="#333" />
              <circle cx="37" cy="35" r="2" fill="#333" />
              <path d="M27 42 Q32 46 37 42" stroke="#333" stroke-width="2" fill="none" />
            </svg>
            <svg class="avatar w-14 h-14 rounded-full cursor-pointer border-4 border-transparent" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="32" fill="#7c3aed" />
              <circle cx="32" cy="36" r="14" fill="#fcd9b6" />
              <path d="M16 24 L22 10 L32 20 L42 10 L48 24 Z" fill="#facc15" />
              <circle cx="27" cy="36" r="2" fill="#333" />
              <circle cx="37" cy="36" r="2" fill="#333" />
              <path d="M27 43 Q32 47 37 43" stroke="#333" stroke-width="2" fill="none" />
            </svg>
          </div>
          <p class="text-red-400 text-sm" id="avatar-error"></p>


          <div class="flex gap-2">
            <button class="flex-1 h-11 rounded-lg bg-amber-500 text-slate-900 font-bold hover:bg-amber-400"
              id="profile-submit">Ajouter</button>
            <button type="button" class="px-4 rounded-lg bg-slate-600 hover:bg-slate-500" id="profile-cancel">Annuler</button>
          </div>
        </form>
        <div class="md:flex-1">
          <h2 id="profile-list-title" class="text-lg font-bold mb-3 md:text-xl"></h2>
          <ul id="profile-list" class="space-y-3"></ul>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
