<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 md:pb-0">
  <header class="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between md:px-8 md:justify-start md:gap-8 md:px-8 md:py-0 md:h-16">
    <h1 class="text-lg font-bold text-amber-400 md:text-xl">Club de cartes</h1>

    <nav class="fixed bottom-0 inset-x-0 z-10 flex bg-slate-800 border-t border-slate-700 md:static md:border-t-0 md:flex-1">
      <button class="flex-1 h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Profils</button>
      <button class="flex-1 h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Jeu</button>
      <button class="flex-1 h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Historique</button>
    </nav>

    <p id="current-player" class="text-xs bg-slate-700 px-3 py-1 rounded-full md:text-sm md:px-4 md:py-2">Aucun joueur choisi</p>
  </header>

  <main class="p-4 max-w-6xl mx-auto md:p-8">
    <section id="profile-form">
      <div class="space-y-4 md:flex md:gap-8 md:space-y-0">
        <form  action="" id="profile-form" class=" bg-slate-800 p-4 rounded-xl space-y-3 md:self-start md:p-6 md:w-96">
          <h2 class="text-lg font-bold md:text-xl">Nouveau profil</h2>

          <input id="profile-id" type="hidden">
          <label class="block text-sm text-slate-300" for="">Pseudo</label>

          <input class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400" id="nickname" type="text">
          <label class="block text-sm text-slate-300" for="">Avatar</label>

          <select  class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400" name="" id="avatar"></select>
          <p class="text-red-400 text-sm" id="profile-error"></p>

          <div class="flex gap-2">
            <button class="flex-1 h-11 rounded-lg bg-amber-500 text-slate-900 font-bold hover:bg-amber-400" id="profile-submit">Ajouter</button>
            <button class="px-4 rounded-lg bg-slate-600 hover:bg-slate-500" id="profile-cancel">Annuler</button>
          </div>
        </form>
        <div class="md:flex-1">
          <h2 id="profile-list-title" class="text-lg font-bold mb-3 md:text-xl"></h2>
          <ul id="profile-list" class="space-y-3"></ul>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
