<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-8 h-16 flex items-center gap-8">
    <h1 class="text-xl font-bold text-amber-400">Club de cartes</h1>

    <nav class="flex flex-1">
      <button class="h-16 px-4 hover:bg-slate-700 focus:outline-none focus:ring-inset focus:ring-amber-400">Profils</button>
      <button class="h-16 px-4 hover:bg-slate-700 focus:outline-none focus:ring-inset focus:ring-amber-400">Jeu</button>
      <button class="h-16 px-4 hover:bg-slate-700 focus:outline-none focus:ring-inset focus:ring-amber-400">Historique</button>
    </nav>

    <p id="current-player" class="text-sm bg-slate-700 px-4 py-2 rounded-full">Aucun joueur choisi</p>
  </header>

  <main class="p-8">
    <section id="profile-form">
      <div class="flex gap-8">
        <form  action="" id="profile-form" class="w-96 bg-slate-800 p-6 rounded-xl space-y-3 self-start">
          <h2 class="text-xl font-bold mb-2">Nouveau profil</h2>

          <input id="profile-id" type="hidden">
          <label class="block text-sm text-slate-300" for="">Pseudo</label>

          <input class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400" id="nickname" type="text">
          <label class="" for="">Avatar</label>

          <select  class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400" name="" id="avatar"></select>
          <p class="text-red-400 text-sm" id="profile-error"></p>

          <div class="flex gap-2">
            <button class="flex-1 h-11 rounded-lg bg-amber-500 text-slate-900 font-bold hover:bg-amber-400" id="profile-submit">Ajouter</button>
            <button class="px-4 rounded-lg bg-slate-600 hover:bg-slate-500" id="profile-cancel">Annuler</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
