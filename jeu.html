<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
    <title>Club de cartes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 md:pb-0">
    <header
        class="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between md:px-8 md:justify-start md:gap-8  md:py-0 md:h-16">
        <h1 class="text-lg font-bold text-amber-400 md:text-xl">Club de cartes</h1>

    <nav
      class="fixed  bottom-0 inset-x-0 z-10 flex bg-slate-800 border-t border-slate-700 md:static md:border-t-0 md:flex-1 gap-8">
      <a href="./index.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Profils</a>
      <a href="./jeu.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Jeu</a>
      <a href="./historique.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Historique</a>
    </nav>

        <p id="current-player" class="text-xs bg-slate-700 px-3 py-1 rounded-full md:text-sm md:px-4 md:py-2">Aucun
            joueur choisi</p>
    </header>

    <main class="p-4 max-w-6xl mx-auto md:p-8">
        <section id="page-game">
            <p id="game-warning" class="text-red-400 text-sm mb-2"></p>

            <button id="start-btn"
                class="w-full h-11 rounded-lg bg-amber-500 text-slate-900 font-bold hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-300 md:w-auto md:px-8">
                Lancer une partie
            </button>
            <div id="game-board" class="hidden mt-4 md:mt-6">
                <div class="space-y-4 md:flex md:gap-8 md:space-y-0">
                    <div id="game-info" class="bg-slate-800 border border-slate-700 rounded-xl p-3 grid grid-cols-2 gap-2 text-sm shadow-lg md:w-72 md:p-6 md:self-start md:grid-cols-1">
                        <p id="manche" class="bg-slate-900 rounded-lg px-3 py-2 text-center font-semibold text-amber-300"></p>
                        <p id="group" class="bg-slate-900 rounded-lg px-3 py-2 text-center font-semibold text-amber-300"></p>
                        <p id="camp-player" class="bg-slate-900 rounded-lg px-3 py-2 text-center capitalize"></p>
                        <p id="first-player" class="bg-slate-900 rounded-lg px-3 py-2 text-center"></p>
                        <p id="player-score" class="bg-emerald-900 rounded-lg px-3 py-2 text-center text-lg font-bold"></p>
                        <p id="computer-score" class="bg-red-900/60 rounded-lg px-3 py-2 text-center text-lg font-bold"></p></p>
                    </div>
                    <div class="space-y-4 md:flex-1 md:space-y-5">
                        <div id="play-ground" class="bg-emerald-900 border-4 border-amber-700 rounded-2xl p-4 space-y-3 shadow-xl md:p-6">
                            <p class="text-center text-xs uppercase tracking-widest text-emerald-300">Ordinateur</p>
                            <div id="computer-hand" class="flex gap-2 justify-center "></div>
                            <div class="flex gap-4 justify-center py-4 md:gap-6">
                                <div class="space-y-1 text-center">
                                    <p class="text-xs text-emerald-300">Ordinateur</p>
                                    <div id="computer-card" class="w-24 h-32 flex items-center justify-center  rounded-lg border-2 border-dashed border-emerald-600 bg-emerald-950/40 md:w-28 md:h-40"></div>
                                </div>
                                <div class="space-y-1 text-center">
                                    <p class="text-xs text-emerald-300">Toi</p>
                                    <div id="player-card" class="w-24 h-32 flex items-center justify-center  rounded-lg border-2 border-dashed border-emerald-600 bg-emerald-950/40 md:w-28 md:h-40"></div>
                                </div>    
                            </div>

                            <p id="game-message" class="text-center text-xl font-bold text-amber-300 h-8"></p>

                            <p class="text-center text-xs uppercase tracking-widest text-emerald-300">Ta main</p>
                            <div id="player-hand" class="flex flex-wrap gap-2 justify-center md:gap-3"></div>
                        </div>

                        <div id="game-end" class="hidden bg-slate-800 p-4 rounded-xl text-center space-y-3 md:p-6">
                            <p id="game-end-text" class="text-lg font-bold md:text-xl"></p>
                            <button id="replay-btn" class="h-11 px-8 rounded-lg bg-amber-500 text-slate-900 font-bold hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-300">Rejouer</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="./src/game.js"></script>
</body>

</html>
