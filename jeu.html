<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 md:pb-0">
  <header class="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between md:px-8 md:justify-start md:gap-8 md:px-8 md:py-0 md:h-16">
    <h1 class="text-lg font-bold text-amber-400 md:text-xl">Club de cartes</h1>

    <nav class="fixed bottom-0 inset-x-0 z-10 flex bg-slate-800 border-t border-slate-700 md:static md:border-t-0 md:flex-1">
      <button class="flex-1 h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Profils</button>
      <button class="flex-1 h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Jeu</button>
      <button class="flex-1 h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Historique</button>
    </nav>

    <p id="current-player" class="text-xs bg-slate-700 px-3 py-1 rounded-full md:text-sm md:px-4 md:py-2">Aucun joueur choisi</p>
  </header>

  <main class="p-4 max-w-6xl mx-auto md:p-8">
    <section id="page-game">
        <p id="game-warning"></p>

        <button id="start-btn">
            Lancer une partie
        </button>
        <div id="game-board">
            <div id="game-info"></div>
            <div>
                <div>
                    <div id="computer-hand"></div>
                    <div>
                        <div id="computer-card"></div>
                        <div id="player-card"></div>
                    </div>
                    <p id="game-message"></p>
                </div>

                <div id="player-hand"></div>
                <div id="game-end">
                    <p id="game-end-text"></p>
                    <button id="replay-btn">Rejouer</button>
                </div>
            </div>
        </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
