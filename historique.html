<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <header>
    <h1>Club de cartes</h1>

    <nav>
      <button>Profils</button>
      <button>Jeu</button>
      <button>Historique</button>
    </nav>

    <p id="corrent-player">Aucun joueur choisi</p>
  </header>

  <main>
    <section id="page-history">
        <h2>Historique</h2>

        <div>
            <input type="text" id="search">
            <select name="" id="filter-result">
                <option value="all">Toutes</option>
                <option value="victoire">Victoires</option>
                <option value="défaite">Défaites</option>
                <option value="égalité">Egalités</option>
            </select>            
            <select name="" id="filter-period">
                <option value="all">Tout</option>
                <option value="today">Aujourd'hui</option>
                <option value="week">7 derniers jours</option>
            </select>
        </div>

        <ul id="history-list"></ul>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
