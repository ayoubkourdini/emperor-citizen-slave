<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 px-8 h-16 flex items-center gap-8">
    <h1 class="text-xl font-bold text-amber-400">Club de cartes</h1>

    <nav class="flex flex-1">
      <button class="h-16 px-4 hover:bg-slate-700 focus:outline-none focus:ring-inset focus:ring-amber-400">Profils</button>
      <button class="h-16 px-4 hover:bg-slate-700 focus:outline-none focus:ring-inset focus:ring-amber-400">Jeu</button>
      <button class="h-16 px-4 hover:bg-slate-700 focus:outline-none focus:ring-inset focus:ring-amber-400">Historique</button>
    </nav>

    <p id="current-player" class="text-sm bg-slate-700 px-4 py-2 rounded-full">Aucun joueur choisi</p>
  </header>

  <main class="p-8">
    <section id="page-history">
        <h2>Historique</h2>

        <div>
            <input type="text" id="search">
            <select name="" id="filter-result">
                <option value="all">Toutes</option>
                <option value="victoire">Victoires</option>
                <option value="défaite">Défaites</option>
                <option value="égalité">Egalités</option>
            </select>            
            <select name="" id="filter-period">
                <option value="all">Tout</option>
                <option value="today">Aujourd'hui</option>
                <option value="week">7 derniers jours</option>
            </select>
        </div>

        <ul id="history-list"></ul>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
