<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jeu de cartes Empereur, Citoyen, Esclave">
  <title>Club de cartes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 md:pb-0">
  <header class="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between md:px-8 md:justify-start md:gap-8 md:px-8 md:py-0 md:h-16">
    <h1 class="text-lg font-bold text-amber-400 md:text-xl">Club de cartes</h1>

    <nav
      class="fixed  bottom-0 inset-x-0 z-10 flex bg-slate-800 border-t border-slate-700 md:static md:border-t-0 md:flex-1 gap-8">
      <a href="./index.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Profils</a>
      <a href="./jeu.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Jeu</a>
      <a href="./historique.html"
        class="flex-1 flex justify-center items-center h-14 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-none md:h-16 md:px-4">Historique</a>
    </nav>

    <p id="current-player" class="text-xs bg-slate-700 px-3 py-1 rounded-full md:text-sm md:px-4 md:py-2">Aucun joueur choisi</p>
  </header>

  <main class="p-4 max-w-6xl mx-auto md:p-8">
    <section id="page-history">
        <h2 class="text-lg font-bold mb-3 md:text-xl">Historique</h2>

        <div class="bg-slate-800 p-4 rounded-xl flex flex-col gap-2 mb-4 md:flex-row md:gap-3 md:p-6 md:mb-6">
            <input type="text" id="search" placeholder="Chercher un pseudo" class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400 md:flex-1">
            <select name="" id="filter-result" class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400 md:w-auto">
                <option value="all">Toutes</option>
                <option value="victoire">Victoires</option>
                <option value="défaite">Défaites</option>
                <option value="égalité">Egalités</option>
            </select>            
            <select name="" id="filter-date" class="w-full h-11 px-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-400 md:w-auto">
                <option value="all">Tout</option>
                <option value="today">Aujourd'hui</option>
                <option value="week">7 derniers jours</option>
            </select>
        </div>
         
        <p id="empty-message" class="hidden text-center text-slate-400 py-8">Aucune partie ne correspond.</p>
        <ul id="history-list" class="space-y-3 md:space-y-4"></ul>
    </section>
  </main>
  <script type="module" src="./src/history.js"></script>
</body>
</html>
